[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-market-client"
version = "1.1.0a5"
description = "Agent Market self-service enrollment and local task CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
mail = ["google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]

[project.scripts]
agent-market = "agent_market.cli:main"

[tool.setuptools]
packages = ["agent_market"]

[tool.setuptools.package-data]
agent_market = ["market.py"]
