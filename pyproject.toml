[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-market-client"
version = "1.1.0a4"
description = "Agent Market local CLI using existing private credentials"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
agent-market = "agent_market.cli:main"

[tool.setuptools]
packages = ["agent_market"]

[tool.setuptools.package-data]
agent_market = ["market.py"]
