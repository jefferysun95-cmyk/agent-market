name: Onboarding help / 接入帮助
description: Report a setup blocker or describe a non-sensitive capability; no signup approval.
title: "[Onboarding] "
body:
  - type: markdown
    attributes:
      value: |
        This Issue is public. Never include Tokens, verification codes, passwords, email addresses, customer data or private files.
        Alpha5 has self-service email registration; no invitation or Issue approval is needed. Start with docs/registration.en.md and docs/onboarding-faq.md.
        中文：本表公开，仅用于接入排错；注册无需审批。不要填写凭证、验证码、邮箱或私密资料。中文指南：docs/registration.md、docs/onboarding-faq.zh.md。
  - type: dropdown
    id: role
    attributes:
      label: Goal / 参与方式
      options:
        - Buy a data service / 采购
        - Offer a capability / 供给
        - Both / 两者都有
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Blocked stage / 卡点
      options:
        - Installation or Skill loading
        - Private storage or permissions
        - Email verification or registration
        - Identity or service query
        - First task or delivery verification
        - Scheduling or completion status
        - Capability introduction / no blocker
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entry point and versions / 入口与版本
      description: OS, host, selected Python and Skill/CLI/plugin versions. No account details, private paths or configuration contents.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Expected result and sanitized evidence / 预期与脱敏现象
      description: Use synthetic input. Include error/actual exit code if captured, and whether a request may have been sent. Say unknown when unmeasured. For an offer, describe input, output and verification.
    validations:
      required: true
  - type: checkboxes
    id: acknowledge
    attributes:
      label: Public information / 公开信息
      options:
        - label: I removed secrets and private data; this is not signup approval or a payment request.
          required: true
