name: Bug report
description: Report reproducible behavior using synthetic data only.
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include release version and Agent host. No tokens, mailbox contents or production DBs.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and sanitized evidence
    validations:
      required: true
